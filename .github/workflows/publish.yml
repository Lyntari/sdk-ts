name: Publish

# Publish-on-tag. Fires on `v*` tags and publishes to npm using the
# repo's `NPM_TOKEN` secret. Release dates live in git tags + the npm
# package metadata; the CHANGELOG no longer carries date stamps per the
# cluster #42 convention retirement (2026-05-27).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify openapi.yaml is current
        run: |
          npm run generate:openapi
          if ! git diff --exit-code openapi.yaml; then
            echo "openapi.yaml is not up to date — run 'npm run generate:openapi' and commit before tagging."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "v${VERSION}" \
          --title "v${VERSION}" \
          --generate-notes
