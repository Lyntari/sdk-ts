name: Publish

# Publish-on-tag. Fires on `v*` tags and publishes to npm using the
# repo's `NPM_TOKEN` secret.
#
# Also auto-stamps the release date into CHANGELOG.md so the published
# tarball carries the actual ship date instead of "Unreleased", and
# commits the stamped CHANGELOG back to main so future readers and the
# next release see the real date in repo history.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the post-publish step can push back to main.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Replace `## v<X.Y.Z> - Unreleased` with `## v<X.Y.Z> - <today UTC>`
      # in CHANGELOG.md for the version being released. Fails the workflow
      # if the expected header isn't present — that's a release-prep
      # mistake (the CHANGELOG should have an Unreleased entry for the
      # tagged version before the tag is cut).
      #
      # The dated CHANGELOG is what gets packed into the npm tarball
      # (publish runs against the modified working tree). After publish,
      # the final step commits the same change back to main.
      - name: Stamp release date in CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TODAY=$(date -u +%Y-%m-%d)
          OLD="## v${VERSION} - Unreleased"
          NEW="## v${VERSION} - ${TODAY}"
          if ! grep -qF "$OLD" CHANGELOG.md; then
            echo "::error::Expected '$OLD' header in CHANGELOG.md not found. Did you forget an Unreleased entry for v${VERSION}?"
            exit 1
          fi
          perl -i -pe "s/\Q$OLD\E/$NEW/" CHANGELOG.md
          echo "Stamped: $OLD → $NEW"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify openapi.yaml is current
        run: |
          npm run generate:openapi
          if ! git diff --exit-code openapi.yaml; then
            echo "openapi.yaml is not up to date — run 'npm run generate:openapi' and commit before tagging."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After successful publish, push the date-stamped CHANGELOG to main.
      # Assumes the tag was cut from main HEAD (the common case). If main
      # has advanced past the tag, the push fails non-fast-forward — we
      # log a warning rather than failing the workflow because the npm
      # publish already succeeded; the maintainer can stamp manually.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "v${VERSION}" \
          --title "v${VERSION}" \
          --generate-notes
