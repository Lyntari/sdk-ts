name: CI

# Typecheck + tests on every push and pull request. The default branch is
# `main`. Push events on feature branches let us see the build before we
# open a PR; PR events catch external contributions if/when the repo opens
# up.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    # TODO: address GitHub "Node.js 20 actions are deprecated" warning when
    # actions/checkout and actions/setup-node ship a Node-22 runtime
    # successor (likely v5). Same TODO applies to publish.yml and
    # openapi-drift.yml. Non-blocking today.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
