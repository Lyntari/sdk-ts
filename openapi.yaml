    name: Proprietary
    identifier: UNLICENSED
  contact:
    name: Lyntari, Inc.
    email: support@lyntari.com
servers:
  - url: https://cylxaiizkxfpohcdgeui.supabase.co/functions/v1
    description: Production
tags:
  - name: auth
    description: Authentication, signup, password reset, account lifecycle.
  - name: visits
    description: Visit signal emission, POS close, history, congestion.
  - name: location
    description: Location updates, nearby venues, beacon detection/config.
  - name: notifications
    description: OneSignal subscriptions, category/notification preferences, push trigger and events.
  - name: reads
    description: Read-only endpoints for stadium, profile, history, categories.
components:
  securitySchemes:
    HmacBody:
      type: apiKey
      in: header
      name: X-Lyntari-Auth (body-located, see description)
      description: 'HMAC-signed POST. Auth lives in the request body as `_auth: { apiKey, timestamp,
        signature }`. The signature is `HMAC-SHA256(canonical_string, hmacSecret)` over
        `timestamp\nmethod\npath\nquery\nbodyHash` with the body hash computed AFTER `_auth` is
        removed. The SDK transport (`postWithHMAC`) injects `_auth` automatically; partners
        hand-rolling the protocol should follow the README "Auth model" section.'
    HmacJwtBody:
      type: apiKey
      in: header
      name: X-Lyntari-Auth-JWT (body-located, see description)
      description: Same as `HmacBody` plus a JWT access token in `_auth.token`. Used by user-facing
        methods that require an authenticated identity. The JWT is issued by `consumer-login`,
        `consumer-signup`, or `auth-refresh`; clients persist it and pass it via
        `client.setAccessToken(token)` in the SDK.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: apikey
      description: API key in the `apikey` header (also accepted as `x-api-key`). Used by read-only GET
        endpoints. For `pos-current-visits`, the API key is the venue-bound POS credential (NOT the
        consumer apiKey).
    ApiKeyBody:
      type: apiKey
      in: header
      name: X-Lyntari-ApiKey-Body (body-located, see description)
      description: API key in `_auth.apiKey` body field, no HMAC signature. Used by `congestion-history`
        (admin/analytics endpoint).
